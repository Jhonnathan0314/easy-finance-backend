name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
    tags:
      - "v*"
  pull_request:

jobs:
  verify:
    name: Maven verify with Testcontainers
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Check Docker
        run: docker version

      - name: Maven unit, slice, and integration tests
        run: mvn -B clean verify -Pci

      - name: Assert integration test reports exist
        run: |
          test -d target/failsafe-reports
          find target/failsafe-reports -name "TEST-*.xml" -print -quit | grep -q .
