services:
  postgres:
    image: postgres:17-alpine
    container_name: easy-finance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_finance}
      POSTGRES_USER: ${POSTGRES_USER:-easy_finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easy_finance}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - easy-finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy_finance} -d ${POSTGRES_DB:-easy_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: easy-finance-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-easy_finance}
      DB_USERNAME: ${POSTGRES_USER:-easy_finance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-easy_finance}
      JWT_ISSUER: ${JWT_ISSUER:-easy-finance}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32bytes-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      EXPENSE_IMPORT_MAX_FILE_SIZE_BYTES: ${EXPENSE_IMPORT_MAX_FILE_SIZE_BYTES:-5242880}
      EXPENSE_IMPORT_MAX_FILE_SIZE: ${EXPENSE_IMPORT_MAX_FILE_SIZE:-5MB}
      EXPENSE_IMPORT_MAX_REQUEST_SIZE: ${EXPENSE_IMPORT_MAX_REQUEST_SIZE:-5MB}
      EXPENSE_IMPORT_MAX_ROWS: ${EXPENSE_IMPORT_MAX_ROWS:-1000}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  easy-finance-postgres-data:
