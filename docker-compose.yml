services:
  postgres:
    image: postgres:17-alpine
    container_name: easy-finance-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-easy_finance}
      POSTGRES_USER: ${POSTGRES_USER:-easy_finance}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-easy_finance}
    ports:
      - "${POSTGRES_PORT:-4350}:5432"
    volumes:
      - easy-finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-easy_finance} -d ${POSTGRES_DB:-easy_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
    container_name: easy-finance-backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-easy_finance}
      DB_USERNAME: ${POSTGRES_USER:-easy_finance}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-easy_finance}
      JWT_ISSUER: ${JWT_ISSUER:-easy-finance}
      JWT_SECRET: ${JWT_SECRET:-local-development-jwt-secret-32bytes-minimum}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT1H}
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://127.0.0.1:4200,https://easyfinance.justeasyproject.com}
      CORS_ALLOWED_METHODS: ${CORS_ALLOWED_METHODS:-GET,POST,PUT,PATCH,DELETE,OPTIONS}
      CORS_ALLOWED_HEADERS: ${CORS_ALLOWED_HEADERS:-Authorization,Content-Type,Accept,Origin,X-Correlation-Id}
      CORS_EXPOSED_HEADERS: ${CORS_EXPOSED_HEADERS:-X-Correlation-Id}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-true}
      CORS_MAX_AGE: ${CORS_MAX_AGE:-1h}
      EXPENSE_IMPORT_MAX_FILE_SIZE_BYTES: ${EXPENSE_IMPORT_MAX_FILE_SIZE_BYTES:-5242880}
      EXPENSE_IMPORT_MAX_FILE_SIZE: ${EXPENSE_IMPORT_MAX_FILE_SIZE:-5MB}
      EXPENSE_IMPORT_MAX_REQUEST_SIZE: ${EXPENSE_IMPORT_MAX_REQUEST_SIZE:-5MB}
      EXPENSE_IMPORT_MAX_ROWS: ${EXPENSE_IMPORT_MAX_ROWS:-1500}
    ports:
      - "${APP_PORT:-8300}:8080"

  frontend:
    build:
      context: ../easy-finance-frontend
    container_name: easy-finance-frontend
    depends_on:
      app:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-4300}:80"

volumes:
  easy-finance-postgres-data:
