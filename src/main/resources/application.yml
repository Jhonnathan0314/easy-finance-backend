spring:
  application:
    name: easy-finance-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/easy_finance}
    username: ${DB_USERNAME:easy_finance}
    password: ${DB_PASSWORD:easy_finance}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      max-file-size: ${EXPENSE_IMPORT_MAX_FILE_SIZE:5MB}
      max-request-size: ${EXPENSE_IMPORT_MAX_REQUEST_SIZE:5MB}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: Easy Finance Backend
    description: Collaborative financial backend

logging:
  level:
    root: INFO
    com.easyfinance: INFO
    org.flywaydb: INFO
    org.springframework.boot.flyway: INFO
    org.springframework.security: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-}] %logger{36} - %msg%n"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

easy-finance:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
      allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${CORS_ALLOWED_HEADERS:Authorization,Content-Type,Accept,Origin,X-Correlation-Id}
      exposed-headers: ${CORS_EXPOSED_HEADERS:X-Correlation-Id}
      allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
      max-age: ${CORS_MAX_AGE:1h}
    jwt:
      issuer: ${JWT_ISSUER:easy-finance}
      secret: ${JWT_SECRET:local-development-jwt-secret-32bytes-minimum}
      expiration: ${JWT_EXPIRATION:PT1H}
  imports:
    expenses:
      max-file-size-bytes: ${EXPENSE_IMPORT_MAX_FILE_SIZE_BYTES:5242880}
      max-rows: ${EXPENSE_IMPORT_MAX_ROWS:1500}
