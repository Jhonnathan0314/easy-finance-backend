spring:
  config:
    activate:
      on-profile: prod
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.easyfinance: INFO
    org.springframework.security: WARN

easy-finance:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://easyfinance.justeasyproject.com}
    jwt:
      secret: ${JWT_SECRET:}
